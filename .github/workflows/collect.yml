name: Collect public option-tape posts
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'greeks_bridge.py'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/collect.yml'
permissions:
  contents: write
concurrency:
  group: greeks-options-feed
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect
        run: python greeks_bridge.py --data-dir data
      - name: Commit snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/messages.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public option-tape snapshots'
            git push
          fi
